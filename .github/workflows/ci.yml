name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: fmt
        run: terraform fmt -check -recursive terraform/
      - name: validate azure stack
        working-directory: terraform/azure
        run: terraform init -backend=false && terraform validate
      - name: validate databricks stack
        working-directory: terraform/databricks
        run: terraform init -backend=false && terraform validate

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: lint
        run: |
          pip install ruff
          ruff check generator/ data/
      - name: syntax-check pipeline sources
        run: python -m py_compile generator/produce.py data/generate_batch_data.py
